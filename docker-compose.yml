version: '3.8'
services:
  backend:
    build: 
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /code
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY api /code/api
        COPY data /code/data
        ENV PYTHONPATH=/code
        CMD ["uvicorn", "api.app.main:app", "--host", "0.0.0.0", "--port", "8008"]
    ports:
      - '8008:8008'
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./data:/code/data
      - ./api:/code/api
  frontend:
    build: 
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm install
        COPY . .
        CMD ["npm", "run", "dev"]
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8008
    volumes:
      - .:/app
      - /app/node_modules
